<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders — THRIFTHEADS®</title><script src="https://cdn.tailwindcss.com"></script></head><body><main class="max-w-5xl mx-auto p-6"><a href="account.html" class="font-black">THRIFTHEADS®</a><h1 class="text-5xl font-black mt-12">MY ORDERS</h1><div id="orders" class="mt-10"></div></main><script type="module">
import {supabase} from "./js/supabase.js";import {getUser} from "./js/auth.js";import {money,escapeHtml} from "./js/utils.js";const u=await getUser();if(!u)location.href="auth.html?redirect=orders.html";else{const {data}=await supabase.from("orders").select("id,order_number,status,total,created_at").eq("user_id",u.id).order("created_at",{ascending:false});document.querySelector("#orders").innerHTML=(data||[]).map(o=>`<a href="order.html?id=${o.id}" class="block border p-5 mb-4 hover:bg-neutral-50"><div class="flex justify-between"><b>${escapeHtml(o.order_number)}</b><b>${money(o.total)}</b></div><p class="mt-2 uppercase text-xs tracking-widest">${escapeHtml(o.status.replaceAll("_"," "))}</p></a>`).join("")||"<p>No orders yet.</p>"}
</script></body></html>
