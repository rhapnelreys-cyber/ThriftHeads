<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Shop — THRIFTHEADS®</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-white text-black">

<!-- ================= HEADER ================= -->

<header class="border-b sticky top-0 bg-white/95 backdrop-blur z-50">

  <nav class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center">

    <a
      href="index.html"
      class="font-black text-xl"
    >
      THRIFTHEADS®
    </a>

    <div class="flex gap-5 text-sm">

      <a href="shop.html">
        Shop
      </a>

      <a href="account.html">
        Account
      </a>

      <a href="cart.html">
        Cart
      </a>

    </div>

  </nav>

</header>


<!-- ================= SHOP ================= -->

<main class="max-w-7xl mx-auto px-5 py-12">

  <div
    class="flex gap-4 flex-col md:flex-row md:items-end md:justify-between"
  >

    <div>

      <p class="text-xs tracking-[.3em] uppercase">
        Catalog
      </p>

      <h1 class="text-5xl font-black">
        SHOP
      </h1>

    </div>


    <input
      id="search"
      class="border border-black/20 px-4 py-3 w-full md:w-80"
      placeholder="Search pieces..."
      autocomplete="off"
    >

  </div>


  <!-- PRODUCTS -->

  <div
    id="grid"
    class="grid grid-cols-2 md:grid-cols-4 gap-5 mt-10"
  >

    <p class="col-span-full text-neutral-500">
      Loading products...
    </p>

  </div>

</main>


<!-- ================= SUPABASE ================= -->

<script type="module">

import { supabase } from "./js/supabase.js";
import { money, escapeHtml } from "./js/utils.js";


const grid = document.querySelector("#grid");
const search = document.querySelector("#search");


/*
========================================================
GET PRODUCT IMAGE FROM SUPABASE STORAGE
========================================================
*/

function getProductImage(product) {

  const images = Array.isArray(product.product_images)
    ? [...product.product_images]
    : [];


  /*
  No images attached to product
  */

  if (!images.length) {
    return null;
  }


  /*
  Primary image first.
  Then sort_order.
  */

  images.sort((a, b) => {

    const primaryDifference =
      Number(b.is_primary) -
      Number(a.is_primary);

    if (primaryDifference !== 0) {
      return primaryDifference;
    }

    return (
      Number(a.sort_order || 0) -
      Number(b.sort_order || 0)
    );

  });


  let path =
    images[0]?.storage_path;


  if (!path) {
    return null;
  }


  path = String(path).trim();


  /*
  If storage_path already contains
  the full URL, use it.
  */

  if (/^https?:\/\//i.test(path)) {
    return path;
  }


  /*
  Remove accidental leading slash.
  */

  path =
    path.replace(/^\/+/, "");


  /*
  Remove bucket name if it was
  accidentally saved in storage_path.
  */

  path =
    path.replace(
      /^product-images\//i,
      ""
    );


  /*
  Generate Supabase Storage URL.
  */

  const {
    data
  } = supabase.storage
    .from("product-images")
    .getPublicUrl(path);


  return data?.publicUrl || null;

}


/*
========================================================
LOAD PRODUCTS
========================================================
*/

async function load() {

  grid.innerHTML = `
    <p class="col-span-full text-neutral-500">
      Loading products...
    </p>
  `;


  /*
  Query products from Supabase.

  product_images is joined automatically
  through the Supabase relationship.
  */

  let query = supabase

    .from("products")

    .select(`
      id,
      name,
      price,
      brand,
      description,
      created_at,
      status,

      product_images (
        storage_path,
        is_primary,
        sort_order
      )
    `)

    .eq("status", "active")

    .order(
      "created_at",
      {
        ascending: false
      }
    );


  /*
  SEARCH
  */

  const keyword =
    search.value.trim();


  if (keyword) {

    query = query.or(
      `name.ilike.%${keyword}%,` +
      `brand.ilike.%${keyword}%,` +
      `description.ilike.%${keyword}%`
    );

  }


  /*
  Execute query
  */

  const {
    data,
    error
  } = await query.limit(100);


  /*
  Database error
  */

  if (error) {

    console.error(
      "Supabase shop error:",
      error
    );


    grid.innerHTML = `
      <div class="col-span-full border border-red-200 bg-red-50 p-5">

        <p class="font-bold text-red-700">
          Failed to load products.
        </p>

        <p class="text-sm text-red-600 mt-2">
          ${escapeHtml(error.message)}
        </p>

      </div>
    `;

    return;

  }


  /*
  No products
  */

  if (!data || data.length === 0) {

    grid.innerHTML = `
      <p class="col-span-full text-neutral-500">
        No pieces found.
      </p>
    `;

    return;

  }


  /*
  RENDER PRODUCTS
  */

  grid.innerHTML = data.map(product => {

    const image =
      getProductImage(product);


    return `

      <a
        class="product-card block"
        href="product.html?id=${product.id}"
      >

        <!-- PRODUCT IMAGE -->

        <div
          class="aspect-[4/5] bg-neutral-100 overflow-hidden"
        >

          ${
            image

              ? `

                <img
                  class="product-image w-full h-full object-cover transition-transform duration-300 hover:scale-105"
                  src="${image}"
                  alt="${escapeHtml(product.name)}"
                  loading="lazy"

                  onerror="
                    this.style.display='none';
                    this.parentElement.innerHTML =
                    '<div class=&quot;w-full h-full grid place-items-center text-neutral-400 text-sm&quot;>Image unavailable</div>';
                  "
                >

              `

              : `

                <div
                  class="w-full h-full grid place-items-center text-neutral-400 text-sm"
                >
                  No image
                </div>

              `
          }

        </div>


        <!-- PRODUCT INFORMATION -->

        <div class="pt-3">

          <p class="font-semibold">
            ${escapeHtml(product.name)}
          </p>


          ${
            product.brand

              ? `

                <p class="text-xs text-neutral-500 mt-1">
                  ${escapeHtml(product.brand)}
                </p>

              `

              : ""
          }


          <p class="text-sm mt-1">
            ${money(product.price)}
          </p>

        </div>

      </a>

    `;

  }).join("");

}


/*
========================================================
SEARCH
========================================================
*/

search.addEventListener(
  "input",
  () => {

    clearTimeout(
      window.shopSearchTimer
    );

    window.shopSearchTimer =
      setTimeout(
        load,
        250
      );

  }
);


/*
========================================================
START
========================================================
*/

load();

</script>

</body>
</html>
