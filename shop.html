<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — THRIFTHEADS®</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"></head><body>
<header class="border-b sticky top-0 bg-white/95 backdrop-blur z-50"><nav class="max-w-7xl mx-auto px-5 py-4 flex justify-between"><a class="font-black text-xl" href="index.html">THRIFTHEADS®</a><div class="flex gap-4"><a href="account.html">Account</a><a href="cart.html">Cart</a></div></nav></header>
<main class="max-w-7xl mx-auto px-5 py-12"><div class="flex gap-4 flex-col md:flex-row md:items-end md:justify-between"><div><p class="text-xs tracking-[.3em] uppercase">Catalog</p><h1 class="text-5xl font-black">SHOP</h1></div><input id="search" class="border border-black/20 px-4 py-3 w-full md:w-80" placeholder="Search pieces..."></div><div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-5 mt-10"></div></main>
<script type="module">
import {supabase} from "./js/supabase.js"; import {money,escapeHtml} from "./js/utils.js";
const grid=document.querySelector("#grid"), search=document.querySelector("#search");
async function load(){let q=supabase.from("products").select("id,name,price,brand,product_images(storage_path,is_primary,sort_order)").eq("status","active").order("created_at",{ascending:false}); const s=search.value.trim(); if(s) q=q.or(`name.ilike.%${s}%,brand.ilike.%${s}%,description.ilike.%${s}%`); const {data,error}=await q.limit(100); if(error){grid.innerHTML=`<p class="col-span-full text-red-600">${escapeHtml(error.message)}</p>`;return} grid.innerHTML=(data||[]).map(p=>{const img=p.product_images?.sort((a,b)=>Number(b.is_primary)-Number(a.is_primary)||a.sort_order-b.sort_order)[0]?.storage_path;const src=img?supabase.storage.from("product-images").getPublicUrl(img).data.publicUrl:"assets/logo/thrifheads-logo.png";return `<a class="product-card" href="product.html?id=${p.id}"><div class="aspect-[4/5] bg-neutral-100 overflow-hidden"><img class="product-image w-full h-full object-cover" src="${src}"></div><div class="pt-3"><p class="font-semibold">${escapeHtml(p.name)}</p><p>${money(p.price)}</p></div></a>`}).join("")||"<p>No pieces found.</p>"} search.addEventListener("input",()=>{clearTimeout(window.t);window.t=setTimeout(load,250)}); load();
</script></body></html>
