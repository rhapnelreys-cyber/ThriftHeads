<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order — THRIFTHEADS®</title><script src="https://cdn.tailwindcss.com"></script></head><body><main class="max-w-3xl mx-auto p-6"><a href="orders.html" class="font-black">← Orders</a><div id="app" class="mt-12"></div></main><script type="module">
import {supabase} from "./js/supabase.js";import {getUser} from "./js/auth.js";import {money,escapeHtml} from "./js/utils.js";const u=await getUser();const id=new URLSearchParams(location.search).get("id");if(!u)location.href="auth.html";else{async function load(){const {data:o}=await supabase.from("orders").select("*,order_items(*),order_status_history(*),shipments(*,tracking_events(*))").eq("id",id).eq("user_id",u.id).single();if(!o){document.querySelector("#app").textContent="Order not found.";return}const events=(o.order_status_history||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));document.querySelector("#app").innerHTML=`<p class="text-xs uppercase tracking-widest">${escapeHtml(o.order_number)}</p><h1 class="text-4xl font-black mt-2">${money(o.total)}</h1><div class="mt-10 space-y-5">${events.map(e=>`<div class="border-l-2 border-black pl-5"><b>${escapeHtml(e.title||e.status)}</b><p class="text-sm text-neutral-500">${new Date(e.created_at).toLocaleString()}</p><p>${escapeHtml(e.description||"")}</p></div>`).join("")}</div>${o.shipments?.[0]?.tracking_number?`<div class="mt-10 border p-5"><b>${escapeHtml(o.shipments[0].courier||"Courier")}</b><p>Tracking: ${escapeHtml(o.shipments[0].tracking_number)}</p></div>`:""}`}load();supabase.channel("order-"+id).on("postgres_changes",{event:"*",schema:"public",table:"order_status_history",filter:"order_id=eq."+id},load).subscribe()}
</script></body></html>
