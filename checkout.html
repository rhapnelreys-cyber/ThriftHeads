<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout — THRIFTHEADS®</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
<main class="max-w-3xl mx-auto p-6">

  <a href="cart.html" class="font-black">
    ← Back to cart
  </a>

  <h1 class="text-5xl font-black mt-12">
    CHECKOUT
  </h1>

  <form id="form" class="mt-10 space-y-4">

    <select
      id="address"
      required
      class="w-full border p-3"
    >
      <option value="">Loading addresses...</option>
    </select>

    <p class="text-sm text-neutral-500">
      Add an address from the account area if none are available.
    </p>

    <textarea
      id="note"
      class="w-full border p-3"
      placeholder="Order note (optional)"
    ></textarea>

    <div class="border-t pt-6">

      <p>
        Shipping: ₱0
      </p>

      <button
        type="submit"
        class="mt-5 bg-black text-white px-8 py-4 font-bold"
      >
        PAY WITH PAYMONGO
      </button>

    </div>

  </form>

  <p id="msg" class="mt-5"></p>

</main>

<script type="module">

import { supabase } from "./js/supabase.js";
import { getUser } from "./js/auth.js";
import {
  createOrder,
  startPayment
} from "./js/checkout.js";

const u = await getUser();

if (!u) {

  location.href = "auth.html?redirect=checkout.html";

} else {

  const sel = document.querySelector("#address");

  const {
    data,
    error
  } = await supabase
    .from("addresses")
    .select("id,label,full_name,line1,house_address,city")
    .eq("user_id", u.id)
    .order("is_default", {
      ascending: false
    });

  if (error) {

    sel.innerHTML =
      `<option value="">Error loading addresses</option>`;

    document.querySelector("#msg").textContent =
      error.message;

  } else {

    sel.innerHTML =
      (data || [])
        .map(a => {

          const addressLine =
            a.line1 ||
            a.house_address ||
            "";

          return `
            <option value="${a.id}">
              ${a.label || "Address"} —
              ${a.full_name || ""},
              ${addressLine},
              ${a.city || ""}
            </option>
          `;

        })
        .join("")
      ||
      `<option value="">No address found</option>`;

  }

  document.querySelector("#form").onsubmit = async e => {

    e.preventDefault();

    const msg = document.querySelector("#msg");

    msg.textContent = "Creating order...";

    try {

      // SHIPPING IS ₱0
      const o = await createOrder(
        sel.value,
        0,
        document.querySelector("#note").value
      );

      if (!o?.order_id) {
        throw new Error("Order was not created.");
      }

      msg.textContent = "Redirecting to PayMongo...";

      await startPayment(o.order_id);

    } catch (x) {

      console.error(x);

      msg.textContent =
        x?.message ||
        "Unable to start payment.";

    }

  };

}

</script>

</body>
</html>
