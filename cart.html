<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — THRIFTHEADS®</title><script src="https://cdn.tailwindcss.com"></script></head><body><main class="max-w-5xl mx-auto p-6"><a href="shop.html" class="font-black text-xl">← THRIFTHEADS®</a><h1 class="text-5xl font-black mt-12">YOUR CART</h1><div id="cart" class="mt-10"></div></main><script type="module">
import {supabase} from "./js/supabase.js";import {getUser} from "./js/auth.js";import {getCart,removeCartItem} from "./js/cart.js";import {money,escapeHtml} from "./js/utils.js";const u=await getUser();const root=document.querySelector("#cart");if(!u){location.href="auth.html?redirect=cart.html"}else{const {data,error}=await getCart(u.id);if(error){root.textContent=error.message}else{const total=(data||[]).reduce((s,x)=>s+Number(x.products.price)*x.quantity,0);root.innerHTML=(data||[]).map(x=>`<div class="border-b py-5 flex justify-between gap-4"><div><b>${escapeHtml(x.products.name)}</b><p>${money(x.products.price)} × ${x.quantity}</p></div><button data-id="${x.id}" class="underline">Remove</button></div>`).join("")+`<div class="text-right mt-8"><p class="text-2xl font-black">${money(total)}</p><a href="checkout.html" class="inline-block mt-5 bg-black text-white px-7 py-4">CHECKOUT</a></div>`;root.querySelectorAll("button").forEach(b=>b.onclick=async()=>{await removeCartItem(b.dataset.id);location.reload()})}}
</script></body></html>
