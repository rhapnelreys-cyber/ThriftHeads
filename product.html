<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — THRIFTHEADS®</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"></head><body><header class="border-b"><nav class="max-w-7xl mx-auto px-5 py-4 flex justify-between"><a class="font-black text-xl" href="index.html">THRIFTHEADS®</a><div class="flex gap-4"><a href="shop.html">Shop</a><a href="cart.html">Cart</a></div></nav></header><main id="app" class="max-w-7xl mx-auto px-5 py-12"></main>
<script type="module">
import {supabase} from "./js/supabase.js";import {getUser} from "./js/auth.js";import {addToCart} from "./js/cart.js";import {money,escapeHtml,toast} from "./js/utils.js";
const id=new URLSearchParams(location.search).get("id"), app=document.querySelector("#app"); if(!id){app.innerHTML="<p>Product not found.</p>"} else {const {data:p,error}=await supabase.from("products").select("*,categories(name),product_images(storage_path,is_primary,sort_order)").eq("id",id).single();if(error||!p){app.innerHTML="<p>Product not found.</p>"}else{const imgs=(p.product_images||[]).sort((a,b)=>Number(b.is_primary)-Number(a.is_primary)||a.sort_order-b.sort_order);const main=imgs[0]?.storage_path;app.innerHTML=`<div class="grid md:grid-cols-2 gap-10"><div class="aspect-[4/5] bg-neutral-100"><img class="w-full h-full object-cover" src="${main?supabase.storage.from("product-images").getPublicUrl(main).data.publicUrl:"assets/logo/thrifheads-logo.png"}"></div><div class="py-4"><p class="text-xs tracking-[.3em] uppercase">${escapeHtml(p.brand||"THRIFTHEADS")}</p><h1 class="text-5xl font-black mt-3">${escapeHtml(p.name)}</h1><p class="text-2xl mt-5">${money(p.price)}</p><div class="mt-8 space-y-2 text-sm"><p><b>Size:</b> ${escapeHtml(p.size||"—")}</p><p><b>Condition:</b> ${escapeHtml(p.condition.replaceAll("_"," "))}</p><p><b>Stock:</b> ${p.stock}</p></div><p class="mt-8 text-neutral-600 leading-7">${escapeHtml(p.description||"A curated ThriftHeads piece.")}</p><button id="add" class="mt-8 bg-black text-white px-8 py-4 uppercase tracking-wider font-bold" ${p.stock<1?"disabled":""}>${p.stock<1?"Sold Out":"Add to Cart"}</button></div></div>`;document.querySelector("#add")?.addEventListener("click",async()=>{const u=await getUser();if(!u){location.href="auth.html?redirect="+encodeURIComponent(location.href);return}try{await addToCart(u.id,p.id,1);toast("Added to cart");}catch(e){toast(e.message,"error")}})}}}
</script></body></html>
