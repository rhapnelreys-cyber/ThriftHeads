<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product — THRIFTHEADS®</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="border-b">
    <nav class="max-w-7xl mx-auto px-5 py-4 flex justify-between">
      <a class="font-black text-xl" href="index.html">THRIFTHEADS®</a>
      <div class="flex gap-4">
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
      </div>
    </nav>
  </header>

  <main id="app" class="max-w-7xl mx-auto px-5 py-12">
    <p>Loading product...</p>
  </main>

  <script type="module">
    import { supabase } from "./js/supabase.js";
    import { getUser } from "./js/auth.js";
    import { addToCart } from "./js/cart.js";
    import { money, escapeHtml, toast } from "./js/utils.js";

    const id = new URLSearchParams(location.search).get("id");
    const app = document.querySelector("#app");

    function fallbackImage() {
      return "assets/logo/thrifheads-logo.png";
    }

    async function loadProduct() {
      if (!id) {
        app.innerHTML = '<p class="text-lg">Product not found.</p>';
        return;
      }

      const { data: p, error } = await supabase
        .from("products")
        .select("*")
        .eq("id", id)
        .single();

      if (error || !p) {
        console.error("Product load error:", error);
        app.innerHTML = '<p class="text-lg">Product not found.</p>';
        return;
      }

      const imageUrl = p.image_url || fallbackImage();

      app.innerHTML = `
        <div class="grid md:grid-cols-2 gap-10">
          <div class="aspect-[4/5] bg-neutral-100 overflow-hidden">
            <img
              class="w-full h-full object-cover"
              src="${escapeHtml(imageUrl)}"
              alt="${escapeHtml(p.name)}"
              onerror="this.src='${fallbackImage()}'"
            >
          </div>

          <div class="py-4">
            <p class="text-xs tracking-[.3em] uppercase">
              ${escapeHtml(p.brand || "THRIFTHEADS")}
            </p>

            <h1 class="text-5xl font-black mt-3">
              ${escapeHtml(p.name)}
            </h1>

            <p class="text-2xl mt-5">
              ${money(p.price)}
            </p>

            <div class="mt-8 space-y-2 text-sm">
              <p><b>SKU:</b> ${escapeHtml(p.sku || "—")}</p>
              <p><b>Size:</b> ${escapeHtml(p.size || "—")}</p>
              <p><b>Condition:</b> ${escapeHtml((p.condition || "—").replaceAll("_", " "))}</p>
              <p><b>Stock:</b> ${p.stock ?? 0}</p>
            </div>

            <p class="mt-8 text-neutral-600 leading-7">
              ${escapeHtml(p.description || "A curated ThriftHeads piece.")}
            </p>

            <button
              id="add"
              class="mt-8 bg-black text-white px-8 py-4 uppercase tracking-wider font-bold disabled:opacity-40"
              ${Number(p.stock) < 1 ? "disabled" : ""}
            >
              ${Number(p.stock) < 1 ? "Sold Out" : "Add to Cart"}
            </button>
          </div>
        </div>
      `;

      document.querySelector("#add")?.addEventListener("click", async () => {
        const u = await getUser();

        if (!u) {
          location.href =
            "auth.html?redirect=" + encodeURIComponent(location.href);
          return;
        }

        try {
          await addToCart(u.id, p.id, 1);
          toast("Added to cart");
        } catch (e) {
          console.error(e);
          toast(e.message || "Unable to add to cart", "error");
        }
      });
    }

    loadProduct();
  </script>
</body>
</html>
