<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — THRIFTHEADS®</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-black grid place-items-center p-5"><div class="bg-white w-full max-w-md p-8"><a href="index.html" class="font-black text-xl">THRIFTHEADS®</a><h1 class="text-4xl font-black mt-10">ACCOUNT</h1><form id="form" class="mt-8 space-y-3"><input id="email" required type="email" placeholder="Email" class="w-full border p-3"><input id="password" required type="password" placeholder="Password" class="w-full border p-3"><input id="first" placeholder="First name (for registration)" class="w-full border p-3"><input id="last" placeholder="Last name (for registration)" class="w-full border p-3"><button class="w-full bg-black text-white p-4 font-bold" id="submit">LOGIN</button></form><button id="toggle" class="mt-4 underline text-sm">Create account</button><p id="msg" class="mt-4 text-sm"></p></div><script type="module">
import {login,register} from "./js/auth.js";const form=document.querySelector("#form"),toggle=document.querySelector("#toggle"),submit=document.querySelector("#submit"),msg=document.querySelector("#msg");let mode="login";toggle.onclick=()=>{mode=mode==="login"?"register":"login";submit.textContent=mode==="login"?"LOGIN":"CREATE ACCOUNT";toggle.textContent=mode==="login"?"Create account":"Already have an account? Login"};form.onsubmit=async e=>{e.preventDefault();msg.textContent="";try{const r=mode==="login"?await login(email.value,password.value):await register(email.value,password.value,first.value,last.value);if(r.error)throw r.error;if(mode==="register"){msg.textContent="Account created. Check your email if confirmation is enabled."}else{location.href=new URLSearchParams(location.search).get("redirect")||"account.html"}}catch(x){msg.textContent=x.message}};</script></body></html>
