<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account — THRIFTHEADS®</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-black">

<main class="max-w-5xl mx-auto p-6">

  <!-- HEADER -->
  <div class="flex justify-between items-center border-b pb-5">
    <a href="index.html" class="font-black text-xl">
      THRIFTHEADS®
    </a>

    <button id="logout" class="underline">
      Logout
    </button>
  </div>


  <!-- TITLE -->
  <h1 class="text-5xl font-black mt-16">
    MY ACCOUNT
  </h1>


  <!-- =====================================================
       PROFILE
  ====================================================== -->

  <section class="mt-10 border p-6">

    <div class="flex justify-between items-center gap-4 flex-wrap">

      <div>
        <h2 class="text-2xl font-black">
          PROFILE
        </h2>

        <p class="text-neutral-500 mt-1">
          Your account information
        </p>
      </div>

      <button
        id="editProfileBtn"
        class="bg-black text-white px-5 py-3 font-bold"
      >
        EDIT PROFILE
      </button>

    </div>


    <div
      id="profile"
      class="mt-6 grid md:grid-cols-2 gap-4"
    ></div>


    <!-- EDIT PROFILE FORM -->

    <form
      id="profileForm"
      class="hidden mt-6 space-y-4"
    >

      <div class="grid md:grid-cols-2 gap-4">

        <input
          id="firstName"
          required
          placeholder="First name"
          class="border p-3 w-full"
        >

        <input
          id="lastName"
          required
          placeholder="Last name"
          class="border p-3 w-full"
        >

      </div>


      <input
        id="phone"
        placeholder="Phone number"
        class="border p-3 w-full"
      >


      <div class="flex gap-3">

        <button
          type="submit"
          class="bg-black text-white px-5 py-3 font-bold"
        >
          SAVE PROFILE
        </button>

        <button
          type="button"
          id="cancelProfile"
          class="border px-5 py-3"
        >
          CANCEL
        </button>

      </div>


      <p id="profileMsg" class="text-sm"></p>

    </form>

  </section>



  <!-- =====================================================
       ADDRESSES
  ====================================================== -->

  <section class="mt-8 border p-6">

    <div class="flex justify-between items-center gap-4 flex-wrap">

      <div>

        <h2 class="text-2xl font-black">
          MY ADDRESSES
        </h2>

        <p class="text-neutral-500 mt-1">
          Save addresses for faster checkout.
        </p>

      </div>


      <button
        id="addAddressBtn"
        class="bg-black text-white px-5 py-3 font-bold"
      >
        + ADD ADDRESS
      </button>

    </div>


    <!-- SAVED ADDRESSES -->

    <div
      id="addresses"
      class="mt-6 grid md:grid-cols-2 gap-4"
    ></div>



    <!-- ADDRESS FORM -->

    <form
      id="addressForm"
      class="hidden mt-6 border-t pt-6 space-y-4"
    >

      <h3
        id="addressFormTitle"
        class="text-xl font-black"
      >
        ADD ADDRESS
      </h3>


      <!-- LABEL + RECIPIENT -->

      <div class="grid md:grid-cols-2 gap-4">

        <input
          id="addressLabel"
          required
          placeholder="Label (Home, School, Work)"
          class="border p-3 w-full"
        >

        <input
          id="addressName"
          required
          placeholder="Recipient full name"
          class="border p-3 w-full"
        >

      </div>


      <!-- PHONE -->

      <input
        id="addressPhone"
        required
        placeholder="Phone number"
        class="border p-3 w-full"
      >


      <!-- ADDRESS LINE 1 -->

      <input
        id="houseAddress"
        required
        placeholder="House / Building / Street"
        class="border p-3 w-full"
      >


      <!-- BARANGAY -->

      <input
        id="barangay"
        required
        placeholder="Barangay"
        class="border p-3 w-full"
      >


      <!-- CITY / PROVINCE / POSTAL -->

      <div class="grid md:grid-cols-3 gap-4">

        <input
          id="city"
          required
          placeholder="City / Municipality"
          class="border p-3 w-full"
        >

        <input
          id="province"
          required
          placeholder="Province"
          class="border p-3 w-full"
        >

        <input
          id="postalCode"
          required
          placeholder="Postal code"
          class="border p-3 w-full"
        >

      </div>


      <!-- DEFAULT -->

      <label class="flex items-center gap-2">

        <input
          id="defaultAddress"
          type="checkbox"
        >

        Set as default address

      </label>


      <!-- BUTTONS -->

      <div class="flex gap-3">

        <button
          type="submit"
          class="bg-black text-white px-5 py-3 font-bold"
        >
          SAVE ADDRESS
        </button>

        <button
          type="button"
          id="cancelAddress"
          class="border px-5 py-3"
        >
          CANCEL
        </button>

      </div>


      <p id="addressMsg" class="text-sm"></p>

    </form>

  </section>



  <!-- =====================================================
       NAVIGATION
  ====================================================== -->

  <div class="mt-8 flex gap-4 flex-wrap">

    <a
      class="border px-5 py-3"
      href="orders.html"
    >
      My Orders
    </a>

    <a
      class="border px-5 py-3"
      href="cart.html"
    >
      Cart
    </a>

    <a
      class="border px-5 py-3"
      href="shop.html"
    >
      Shop
    </a>

  </div>

</main>



<script type="module">

import { supabase } from "./js/supabase.js";
import { logout } from "./js/auth.js";
import { requireUser } from "./js/utils.js";


/* =====================================================
   USER
===================================================== */

const user = await requireUser(supabase);

if (!user) {
  throw new Error("User not authenticated.");
}



/* =====================================================
   ELEMENTS
===================================================== */

const profileEl =
  document.querySelector("#profile");

const addressesEl =
  document.querySelector("#addresses");

const profileForm =
  document.querySelector("#profileForm");

const addressForm =
  document.querySelector("#addressForm");

const profileMsg =
  document.querySelector("#profileMsg");

const addressMsg =
  document.querySelector("#addressMsg");


let editingAddressId = null;



/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value) {

  const div = document.createElement("div");

  div.textContent = value ?? "";

  return div.innerHTML;

}



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(element, message, error = false) {

  element.textContent = message;

  element.className = error
    ? "text-sm text-red-600"
    : "text-sm text-green-600";

}



/* =====================================================
   CLEAR ADDRESS FORM
===================================================== */

function clearAddressForm() {

  editingAddressId = null;

  document.querySelector("#addressFormTitle").textContent =
    "ADD ADDRESS";

  document.querySelector("#addressLabel").value = "";

  document.querySelector("#addressName").value = "";

  document.querySelector("#addressPhone").value = "";

  document.querySelector("#houseAddress").value = "";

  document.querySelector("#barangay").value = "";

  document.querySelector("#city").value = "";

  document.querySelector("#province").value = "";

  document.querySelector("#postalCode").value = "";

  document.querySelector("#defaultAddress").checked = false;

  addressMsg.textContent = "";

}



/* =====================================================
   FILL ADDRESS FORM
===================================================== */

function fillAddressForm(address) {

  editingAddressId = address.id;

  document.querySelector("#addressFormTitle").textContent =
    "EDIT ADDRESS";


  document.querySelector("#addressLabel").value =
    address.label || "";


  /*
    IMPORTANT:
    Your database uses recipient_name.
  */

  document.querySelector("#addressName").value =
    address.recipient_name || "";


  document.querySelector("#addressPhone").value =
    address.phone || "";


  /*
    Your database requires line1.
    We use line1 as the main street/address field.
  */

  document.querySelector("#houseAddress").value =
    address.line1 ||
    address.house_address ||
    "";


  document.querySelector("#barangay").value =
    address.barangay || "";


  document.querySelector("#city").value =
    address.city || "";


  document.querySelector("#province").value =
    address.province || "";


  document.querySelector("#postalCode").value =
    address.postal_code || "";


  document.querySelector("#defaultAddress").checked =
    !!address.is_default;


  addressForm.classList.remove("hidden");

  addressForm.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}



/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile() {

  const { data, error } =
    await supabase
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .single();


  if (error) {

    profileEl.innerHTML = `
      <p class="text-red-600">
        ${esc(error.message)}
      </p>
    `;

    return;
  }


  const fullName =
    `${data?.first_name || ""} ${data?.last_name || ""}`
      .trim();


  profileEl.innerHTML = `

    <div>

      <p class="text-xs uppercase tracking-widest text-neutral-500">
        Name
      </p>

      <p class="font-bold mt-1">
        ${esc(fullName || "—")}
      </p>

    </div>


    <div>

      <p class="text-xs uppercase tracking-widest text-neutral-500">
        Email
      </p>

      <p class="font-bold mt-1">
        ${esc(user.email)}
      </p>

    </div>


    <div>

      <p class="text-xs uppercase tracking-widest text-neutral-500">
        Phone
      </p>

      <p class="font-bold mt-1">
        ${esc(data?.phone || "—")}
      </p>

    </div>

  `;


  document.querySelector("#firstName").value =
    data?.first_name || "";

  document.querySelector("#lastName").value =
    data?.last_name || "";

  document.querySelector("#phone").value =
    data?.phone || "";

}



/* =====================================================
   LOAD ADDRESSES
===================================================== */

async function loadAddresses() {

  const { data, error } =
    await supabase
      .from("addresses")
      .select("*")
      .eq("user_id", user.id)
      .order("is_default", {
        ascending: false
      })
      .order("created_at", {
        ascending: false
      });


  if (error) {

    addressesEl.innerHTML = `
      <p class="text-red-600">
        ${esc(error.message)}
      </p>
    `;

    return;
  }


  if (!data || data.length === 0) {

    addressesEl.innerHTML = `

      <div
        class="border border-dashed p-8 md:col-span-2 text-center"
      >

        <p class="font-bold">
          No saved addresses yet.
        </p>

        <p class="text-neutral-500 mt-1">
          Add your delivery address for faster checkout.
        </p>

      </div>

    `;

    return;
  }


  addressesEl.innerHTML = data.map(address => `

    <article class="border p-5">

      <div class="flex justify-between gap-3">

        <div>

          <h3 class="font-black text-lg">
            ${esc(address.label)}
          </h3>


          ${
            address.is_default
              ? `
                <span
                  class="inline-block mt-2 text-xs bg-black text-white px-2 py-1"
                >
                  DEFAULT
                </span>
              `
              : ""
          }

        </div>


        <div class="flex gap-3">

          <button
            data-edit="${address.id}"
            class="underline"
          >
            Edit
          </button>

          <button
            data-delete="${address.id}"
            class="underline"
          >
            Delete
          </button>

        </div>

      </div>


      <div class="mt-4 text-sm leading-6">

        <p class="font-bold">
          ${esc(address.recipient_name)}
        </p>

        <p>
          ${esc(address.phone)}
        </p>

        <p>
          ${esc(
            address.line1 ||
            address.house_address ||
            ""
          )}
        </p>

        <p>
          ${esc(address.barangay)},
          ${esc(address.city)}
        </p>

        <p>
          ${esc(address.province)}
          ${esc(address.postal_code)}
        </p>

      </div>


      ${
        address.is_default
          ? ""
          : `
            <button
              data-default="${address.id}"
              class="mt-4 border px-4 py-2 text-sm"
            >
              Set as Default
            </button>
          `
      }

    </article>

  `).join("");



  /* =====================================================
     EDIT ADDRESS
  ====================================================== */

  addressesEl
    .querySelectorAll("[data-edit]")
    .forEach(button => {

      button.onclick = () => {

        const address =
          data.find(
            item =>
              item.id === button.dataset.edit
          );

        if (address) {
          fillAddressForm(address);
        }

      };

    });



  /* =====================================================
     DELETE ADDRESS
  ====================================================== */

  addressesEl
    .querySelectorAll("[data-delete]")
    .forEach(button => {

      button.onclick = async () => {

        if (!confirm("Delete this address?")) {
          return;
        }


        const { error } =
          await supabase
            .from("addresses")
            .delete()
            .eq("id", button.dataset.delete)
            .eq("user_id", user.id);


        if (error) {

          alert(error.message);

          return;
        }


        await loadAddresses();

      };

    });



  /* =====================================================
     SET DEFAULT
  ====================================================== */

  addressesEl
    .querySelectorAll("[data-default]")
    .forEach(button => {

      button.onclick = async () => {

        const addressId =
          button.dataset.default;


        /*
          Remove default from
          all user's addresses first.
        */

        const { error: clearError } =
          await supabase
            .from("addresses")
            .update({
              is_default: false
            })
            .eq("user_id", user.id);


        if (clearError) {

          alert(clearError.message);

          return;
        }


        /*
          Set selected address
          as the only default.
        */

        const { error } =
          await supabase
            .from("addresses")
            .update({
              is_default: true
            })
            .eq("id", addressId)
            .eq("user_id", user.id);


        if (error) {

          alert(error.message);

          return;
        }


        await loadAddresses();

      };

    });

}



/* =====================================================
   EDIT PROFILE BUTTON
===================================================== */

document.querySelector("#editProfileBtn").onclick = () => {

  profileForm.classList.remove("hidden");

  profileForm.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

};



/* =====================================================
   CANCEL PROFILE
===================================================== */

document.querySelector("#cancelProfile").onclick = () => {

  profileForm.classList.add("hidden");

  profileMsg.textContent = "";

};



/* =====================================================
   SAVE PROFILE
===================================================== */

profileForm.onsubmit = async event => {

  event.preventDefault();


  const firstName =
    document.querySelector("#firstName")
      .value
      .trim();

  const lastName =
    document.querySelector("#lastName")
      .value
      .trim();

  const phone =
    document.querySelector("#phone")
      .value
      .trim();


  const { error } =
    await supabase
      .from("profiles")
      .update({

        first_name: firstName,

        last_name: lastName,

        phone: phone || null

      })
      .eq("id", user.id);


  if (error) {

    showMessage(
      profileMsg,
      error.message,
      true
    );

    return;
  }


  showMessage(
    profileMsg,
    "Profile updated successfully."
  );


  profileForm.classList.add("hidden");

  await loadProfile();

};



/* =====================================================
   ADD ADDRESS BUTTON
===================================================== */

document.querySelector("#addAddressBtn").onclick = () => {

  clearAddressForm();

  addressForm.classList.remove("hidden");

  addressForm.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

};



/* =====================================================
   CANCEL ADDRESS
===================================================== */

document.querySelector("#cancelAddress").onclick = () => {

  addressForm.classList.add("hidden");

  clearAddressForm();

};



/* =====================================================
   SAVE ADDRESS
===================================================== */

addressForm.onsubmit = async event => {

  event.preventDefault();


  const label =
    document.querySelector("#addressLabel")
      .value
      .trim();

  const recipientName =
    document.querySelector("#addressName")
      .value
      .trim();

  const phone =
    document.querySelector("#addressPhone")
      .value
      .trim();

  const line1 =
    document.querySelector("#houseAddress")
      .value
      .trim();

  const barangay =
    document.querySelector("#barangay")
      .value
      .trim();

  const city =
    document.querySelector("#city")
      .value
      .trim();

  const province =
    document.querySelector("#province")
      .value
      .trim();

  const postalCode =
    document.querySelector("#postalCode")
      .value
      .trim();

  const makeDefault =
    document.querySelector("#defaultAddress")
      .checked;



  /* =====================================================
     VALIDATION
  ====================================================== */

  if (
    !label ||
    !recipientName ||
    !phone ||
    !line1 ||
    !barangay ||
    !city ||
    !province ||
    !postalCode
  ) {

    showMessage(
      addressMsg,
      "Please complete all address fields.",
      true
    );

    return;
  }



  /* =====================================================
     DEFAULT ADDRESS
  ====================================================== */

  /*
    If this address becomes default,
    remove default from all others.
  */

  if (makeDefault) {

    const { error } =
      await supabase
        .from("addresses")
        .update({
          is_default: false
        })
        .eq("user_id", user.id);


    if (error) {

      showMessage(
        addressMsg,
        error.message,
        true
      );

      return;
    }

  }



  /* =====================================================
     DATABASE PAYLOAD
  ====================================================== */

  const payload = {

    user_id: user.id,

    label: label,

    /*
      Your database requires this column.
    */

    recipient_name: recipientName,

    phone: phone,

    /*
      IMPORTANT:
      Your database requires line1.
    */

    line1: line1,

    /*
      Keep house_address too.
    */

    house_address: line1,

    barangay: barangay,

    city: city,

    province: province,

    postal_code: postalCode,

    is_default: makeDefault

  };



  /* =====================================================
     UPDATE EXISTING ADDRESS
  ====================================================== */

  if (editingAddressId) {

    const { error } =
      await supabase
        .from("addresses")
        .update(payload)
        .eq("id", editingAddressId)
        .eq("user_id", user.id);


    if (error) {

      showMessage(
        addressMsg,
        error.message,
        true
      );

      return;
    }

  }



  /* =====================================================
     CREATE NEW ADDRESS
  ====================================================== */

  else {

    const { error } =
      await supabase
        .from("addresses")
        .insert(payload);


    if (error) {

      showMessage(
        addressMsg,
        error.message,
        true
      );

      return;
    }

  }



  /* =====================================================
     SUCCESS
  ====================================================== */

  showMessage(
    addressMsg,
    "Address saved successfully."
  );


  await loadAddresses();


  setTimeout(() => {

    addressForm.classList.add("hidden");

    clearAddressForm();

  }, 700);

};



/* =====================================================
   LOGOUT
===================================================== */

document.querySelector("#logout").onclick = logout;



/* =====================================================
   INITIAL LOAD
===================================================== */

await loadProfile();

await loadAddresses();

</script>

</body>
</html>
