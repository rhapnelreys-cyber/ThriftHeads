<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — THRIFTHEADS®</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white grid place-items-center min-h-screen"><form id="f" class="bg-white text-black p-8 w-full max-w-md"><b>THRIFTHEADS® ADMIN</b><h1 class="text-4xl font-black mt-10">LOGIN</h1><input id="e" type="email" required placeholder="Email" class="border p-3 w-full mt-6"><input id="p" type="password" required placeholder="Password" class="border p-3 w-full mt-3"><button class="bg-black text-white w-full p-4 mt-4">LOGIN</button><p id="m" class="mt-4 text-red-600"></p></form><script type="module">import {login,requireRole} from "../js/auth.js";document.querySelector("#f").onsubmit=async e=>{e.preventDefault();const r=await login(document.querySelector("#e").value,document.querySelector("#p").value);if(r.error){m.textContent=r.error.message;return}const a=await requireRole(["admin","staff"]);if(a)location.href="dashboard.html"};</script></body></html>
