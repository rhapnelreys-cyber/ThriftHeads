<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order — THRIFTHEADS®</title><script src="https://cdn.tailwindcss.com"></script></head><body><main class="max-w-3xl mx-auto p-6"><a href="orders.html" class="font-black">← Orders</a><div id="app" class="mt-10"></div></main><script type="module">
import {supabase} from "../js/supabase.js";import {requireRole} from "../js/auth.js";import {money,escapeHtml} from "../js/utils.js";const a=await requireRole(["admin","staff"]);const id=new URLSearchParams(location.search).get("id");if(a){const {data:o}=await supabase.from("orders").select("*,order_items(*),shipments(*),profiles(email,first_name,last_name)").eq("id",id).single();if(o){document.querySelector("#app").innerHTML=`<h1 class="text-4xl font-black">${escapeHtml(o.order_number)}</h1><p class="mt-2">${escapeHtml(o.profiles?.email||"")}</p><div class="mt-8 space-y-2">${o.order_items.map(i=>`<div class="flex justify-between border-b py-2"><span>${escapeHtml(i.product_name)} × ${i.quantity}</span><b>${money(i.line_total)}</b></div>`).join("")}</div><p class="text-2xl font-black text-right mt-5">${money(o.total)}</p><select id="status" class="border p-3 mt-8 w-full">${["paid","processing","packed","shipped","in_transit","out_for_delivery","delivered","cancelled","refunded"].map(s=>`<option ${o.status===s?"selected":""} value="${s}">${s}</option>`).join("")}</select><button id="save" class="bg-black text-white p-4 mt-3 w-full">UPDATE STATUS</button><div class="mt-8 border-t pt-8"><h2 class="font-bold">Shipment</h2><input id="courier" class="border p-3 w-full mt-3" placeholder="Courier"><input id="tracking" class="border p-3 w-full mt-3" placeholder="Tracking number"><button id="ship" class="bg-black text-white p-3 mt-3">SAVE TRACKING</button></div>`;save.onclick=async()=>{const r=await supabase.rpc("admin_update_order_status",{p_order_id:id,p_status:status.value,p_title:null,p_description:null});if(r.error)alert(r.error.message);else location.reload()};ship.onclick=async()=>{const r=await supabase.rpc("admin_upsert_shipment",{p_order_id:id,p_courier:courier.value,p_service:"Standard",p_tracking_number:tracking.value,p_status:"label_created"});if(r.error)alert(r.error.message);else alert("Shipment saved.")}}}
</script></body></html>
