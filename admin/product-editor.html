<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Editor — THRIFTHEADS®</title><script src="https://cdn.tailwindcss.com"></script></head><body><main class="max-w-3xl mx-auto p-6"><a href="products.html" class="font-black">← Products</a><h1 id="title" class="text-5xl font-black mt-12">ADD PRODUCT</h1><form id="f" class="mt-8 space-y-3"><input id="name" required placeholder="Name" class="border p-3 w-full"><input id="sku" required placeholder="SKU" class="border p-3 w-full"><input id="slug" required placeholder="Slug" class="border p-3 w-full"><input id="brand" placeholder="Brand" class="border p-3 w-full"><input id="size" placeholder="Size" class="border p-3 w-full"><input id="price" required type="number" step=".01" placeholder="Price" class="border p-3 w-full"><input id="stock" required type="number" min="0" placeholder="Stock" class="border p-3 w-full"><select id="condition" class="border p-3 w-full"><option value="excellent">Excellent</option><option value="very_good">Very Good</option><option value="good">Good</option><option value="fair">Fair</option><option value="new_with_tags">New With Tags</option></select><select id="status" class="border p-3 w-full"><option value="draft">Draft</option><option value="active">Active</option><option value="archived">Archived</option></select><textarea id="description" placeholder="Description" class="border p-3 w-full h-40"></textarea><label class="flex gap-2"><input id="featured" type="checkbox"> Featured</label><button class="bg-black text-white px-8 py-4">SAVE PRODUCT</button><p id="msg"></p></form></main><script type="module">
import {supabase} from "../js/supabase.js";import {requireRole} from "../js/auth.js";const a=await requireRole(["admin","staff"]);const id=new URLSearchParams(location.search).get("id");if(a){if(id){const {data:p}=await supabase.from("products").select("*").eq("id",id).single();if(p){for(const k of ["name","sku","slug","brand","size","price","stock","condition","status","description"])document.querySelector("#"+k).value=p[k]??"";featured.checked=p.is_featured;title.textContent="EDIT PRODUCT"}}document.querySelector("#f").onsubmit=async e=>{e.preventDefault();const payload={name:name.value,sku:sku.value,slug:slug.value,brand:brand.value||null,size:size.value||null,price:Number(price.value),stock:Number(stock.value),condition:condition.value,status:status.value,description:description.value||null,is_featured:featured.checked};const r=id?await supabase.from("products").update(payload).eq("id",id):await supabase.from("products").insert(payload);msg.textContent=r.error?r.error.message:"Saved.";if(!r.error&&!id)setTimeout(()=>location.href="products.html",500)}}}
</script></body></html>
