<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales — THRIFTHEADS®</title><script src="https://cdn.tailwindcss.com"></script></head><body><main class="max-w-5xl mx-auto p-6"><a href="dashboard.html" class="font-black">THRIFTHEADS® ADMIN</a><h1 class="text-5xl font-black mt-12">SALES</h1><div id="sales" class="mt-10 text-5xl font-black"></div></main><script type="module">import {supabase} from "../js/supabase.js";import {requireRole} from "../js/auth.js";import {money} from "../js/utils.js";const a=await requireRole(["admin","staff"]);if(a){const {data}=await supabase.from("orders").select("total,status").in("status",["paid","processing","packed","shipped","in_transit","out_for_delivery","delivered"]);document.querySelector("#sales").textContent=money((data||[]).reduce((s,x)=>s+Number(x.total),0))}</script></body></html>
