<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders — THRIFTHEADS®</title><script src="https://cdn.tailwindcss.com"></script></head><body><main class="max-w-7xl mx-auto p-6"><a href="dashboard.html" class="font-black">THRIFTHEADS® ADMIN</a><h1 class="text-5xl font-black mt-12">ORDERS</h1><div id="list" class="mt-8"></div></main><script type="module">
import {supabase} from "../js/supabase.js";import {requireRole} from "../js/auth.js";import {money,escapeHtml} from "../js/utils.js";const a=await requireRole(["admin","staff"]);if(a){const {data}=await supabase.from("orders").select("id,order_number,status,total,created_at,profiles(email,first_name,last_name)").order("created_at",{ascending:false});document.querySelector("#list").innerHTML=(data||[]).map(o=>`<a href="order.html?id=${o.id}" class="block border p-5 mb-3"><div class="flex justify-between"><b>${escapeHtml(o.order_number)}</b><b>${money(o.total)}</b></div><p>${escapeHtml(o.profiles?.first_name||"")} ${escapeHtml(o.profiles?.last_name||"")} — ${escapeHtml(o.status)}</p></a>`).join("")||"<p>No orders.</p>"}
</script></body></html>
