<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products — THRIFTHEADS®</title><script src="https://cdn.tailwindcss.com"></script></head><body><main class="max-w-7xl mx-auto p-6"><div class="flex justify-between"><a href="dashboard.html" class="font-black">THRIFTHEADS® ADMIN</a><a href="product-editor.html" class="bg-black text-white px-5 py-3">+ ADD PRODUCT</a></div><h1 class="text-5xl font-black mt-12">PRODUCTS</h1><div id="list" class="mt-8"></div></main><script type="module">
import {supabase} from "../js/supabase.js";import {requireRole} from "../js/auth.js";import {money,escapeHtml} from "../js/utils.js";const a=await requireRole(["admin","staff"]);if(a){async function load(){const {data}=await supabase.from("products").select("id,name,sku,price,stock,status").order("created_at",{ascending:false});document.querySelector("#list").innerHTML=`<div class="overflow-auto"><table class="w-full text-left"><thead><tr class="border-b"><th class="p-3">Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody>${(data||[]).map(p=>`<tr class="border-b"><td class="p-3 font-semibold">${escapeHtml(p.name)}</td><td>${escapeHtml(p.sku)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${p.status}</td><td><a class="underline" href="product-editor.html?id=${p.id}">Edit</a></td></tr>`).join("")}</tbody></table></div>`}load()}
</script></body></html>
